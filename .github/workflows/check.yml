name: Check for new releases
on:
  schedule:
    - cron: "0 8 * * *"   # hourly; change to "0 8 * * *" for daily at 08:00 UTC
  workflow_dispatch:        # lets you run it manually to test

permissions:
  contents: write           # needed to commit the state file back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python check_releases.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      - name: Commit updated state
        run: |
          git config user.name "release-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update release state"
          git push